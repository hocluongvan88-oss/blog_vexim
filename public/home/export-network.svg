<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 540" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">From a Vietnamese factory to international buyers</title>
  <desc id="desc">Isometric illustration of a factory, a digital product catalog, and buyer destinations in North America and Europe connected by a blue route.</desc>
  <defs>
    <linearGradient id="floor" x1="100" y1="250" x2="970" y2="520" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset="1" stop-color="#DFE9FC"/></linearGradient>
    <linearGradient id="blue" x1="535" y1="110" x2="694" y2="356" gradientUnits="userSpaceOnUse"><stop stop-color="#80B6FF"/><stop offset=".52" stop-color="#1675DD"/><stop offset="1" stop-color="#4356C6"/></linearGradient>
    <linearGradient id="wall" x1="145" y1="165" x2="440" y2="350" gradientUnits="userSpaceOnUse"><stop stop-color="#fff"/><stop offset="1" stop-color="#CDDCF8"/></linearGradient>
    <linearGradient id="globe" x1="815" y1="116" x2="1007" y2="332" gradientUnits="userSpaceOnUse"><stop stop-color="#F7FBFF"/><stop offset=".55" stop-color="#ABC8FD"/><stop offset="1" stop-color="#648FDF"/></linearGradient>
    <linearGradient id="glass" x1="465" y1="92" x2="712" y2="353" gradientUnits="userSpaceOnUse"><stop stop-color="#fff" stop-opacity=".98"/><stop offset="1" stop-color="#E7F0FF" stop-opacity=".9"/></linearGradient>
    <linearGradient id="edge" x1="95" y1="330" x2="980" y2="525" gradientUnits="userSpaceOnUse"><stop stop-color="#AFCBF6"/><stop offset="1" stop-color="#657EC3"/></linearGradient>
    <radialGradient id="halo"><stop stop-color="#BBD6FF" stop-opacity=".72"/><stop offset="1" stop-color="#BBD6FF" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-40%" width="170%" height="190%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="soft" x="-25%" y="-25%" width="150%" height="160%"><feDropShadow dx="0" dy="15" stdDeviation="17" flood-color="#355EB2" flood-opacity=".17"/></filter>
  </defs>
  <ellipse cx="574" cy="385" rx="535" ry="155" fill="url(#halo)"/>
  <path d="M77 385 456 191l640 190-386 193Z" fill="#5A79B0" opacity=".19" filter="url(#shadow)"/>
  <g filter="url(#soft)">
    <path d="m83 349 385-194 628 194-385 194Z" fill="url(#floor)" stroke="#C4D6F2" stroke-width="2"/>
    <path d="m83 349 628 194v-24L83 327z" fill="#A9C4ED"/>
    <path d="m711 543 385-194v-22L711 519z" fill="url(#edge)"/>
    <path d="m83 327 385-194 628 194-385 194Z" fill="url(#floor)" stroke="#B9D1F4" stroke-width="2"/>
  </g>
  <g opacity=".48" stroke="#BED1EF" stroke-width="1">
    <path d="m171 349 374-184M293 389l375-187M418 427l377-189M539 465l379-188M650 499l380-188"/>
    <path d="m180 279 617 194m-507-251 617 194M397 169l618 194"/>
  </g>
  <!-- Vietnamese factory: roof and walls are true isometric faces. -->
  <g filter="url(#soft)">
    <path d="m164 247 143 72v97l-143-72z" fill="url(#wall)" stroke="#A9C3E9" stroke-width="2"/>
    <path d="m307 319 143-73v99l-143 71z" fill="#A7C4EE" stroke="#8DAEE0" stroke-width="2"/>
    <path d="m164 247 143-75 143 74-143 73z" fill="#fff" stroke="#AFC8EB" stroke-width="2"/>
    <path d="m183 247 124-63 124 63-124 63z" fill="#EBF3FF"/>
    <path d="m211 232 96-47 96 48-96 49z" fill="#D5E7FF"/>
    <path d="m204 258 85 43m-62-63 85 42m-37-63 86 43" stroke="#B0CAED" stroke-width="4" stroke-linecap="round"/>
    <path d="m184 284 29 15v23l-29-15zm43 23 29 15v23l-29-15zm43 22 23 13v23l-23-12z" fill="#8AB5ED" stroke="#fff" stroke-width="2"/>
    <path d="m337 331 30-15v24l-30 16zm52-26 31-16v25l-31 15z" fill="#DAECFF" stroke="#739BD3" stroke-width="2"/>
    <path d="m330 369 49-25v58l-49 24z" fill="#6F9EDB" stroke="#fff" stroke-width="2"/>
    <path d="m330 369 49-25v14l-49 25z" fill="#3E7AC7"/>
    <path d="m181 258 10 5v-35l-10-5z" fill="#89AFE5"/><path d="m191 263 13-7v-34l-13 6z" fill="#6D91D2"/>
    <path d="m379 220 13 7v-42l-13-7z" fill="#8DABE1"/><path d="m392 227 11-6v-42l-11 6z" fill="#5D87CE"/>
  </g>
  <!-- Soft route connects the three scenes, without inventing live performance data. -->
  <path d="M348 159c63-55 151-65 204-27 66 48 56 137 115 144 43 5 64-56 133-84" stroke="#B7D4FF" stroke-width="21" stroke-linecap="round" opacity=".45"/>
  <path d="M348 159c63-55 151-65 204-27 66 48 56 137 115 144 43 5 64-56 133-84" stroke="url(#blue)" stroke-width="4" stroke-linecap="round" stroke-dasharray="1 14"/>
  <circle cx="350" cy="160" r="7" fill="#fff" stroke="#1882E4" stroke-width="4"/>
  <circle cx="804" cy="192" r="7" fill="#fff" stroke="#1882E4" stroke-width="4"/>
  <!-- Floating structured product catalog. -->
  <g filter="url(#soft)">
    <rect x="482" y="151" width="208" height="175" rx="25" fill="url(#glass)" stroke="#B6CEF3" stroke-width="2"/>
    <rect x="499" y="170" width="174" height="34" rx="11" fill="#E5F0FF"/>
    <circle cx="519" cy="187" r="7" fill="#0071E3"/><rect x="538" y="183" width="83" height="7" rx="3.5" fill="#8CB0DF"/>
    <rect x="502" y="219" width="65" height="77" rx="12" fill="#D7E9FF"/>
    <path d="m513 246 21-11 22 11-22 11z" fill="#fff" stroke="#6097DF" stroke-width="2"/>
    <path d="m513 246 21 11v18l-21-11z" fill="#88B3F0"/>
    <path d="m534 257 22-11v18l-22 11z" fill="#347BD2"/>
    <rect x="579" y="222" width="73" height="8" rx="4" fill="#6C93D0"/><rect x="579" y="240" width="50" height="6" rx="3" fill="#C3D6F1"/>
    <rect x="579" y="257" width="80" height="6" rx="3" fill="#C3D6F1"/><rect x="579" y="274" width="61" height="6" rx="3" fill="#C3D6F1"/>
    <path d="M486 317h201l24 17H462z" fill="#AFCBF0"/><path d="M462 334h249l-15 7H479z" fill="#739DDA"/>
  </g>
  <!-- Globe and two independently marked buyer destinations. -->
  <g filter="url(#soft)">
    <ellipse cx="912" cy="362" rx="130" ry="44" fill="#9DBEF1" opacity=".6"/>
    <path d="m824 351 87 41 91-42-91-42z" fill="#E9F2FF" stroke="#9DBDEB" stroke-width="2"/>
    <path d="m824 351 87 41v19l-87-41z" fill="#AAC7EF"/><path d="m911 392 91-42v18l-91 43z" fill="#719ADD"/>
    <circle cx="911" cy="218" r="99" fill="url(#globe)" stroke="#B3D0F7" stroke-width="3"/>
    <ellipse cx="911" cy="218" rx="99" ry="34" stroke="#DCEBFF" stroke-width="2" opacity=".85"/>
    <ellipse cx="911" cy="218" rx="52" ry="99" stroke="#E1EEFF" stroke-width="2" opacity=".85"/>
    <path d="M814 218h194m-180-49h166m-162 98h160" stroke="#EAF3FF" stroke-width="2" opacity=".82"/>
    <path d="m863 153 23-9 22 10 10 19-15 5-4 18-25-8-11-16zm57 76 16-13 26 3 12 20-14 14-13-4-14 15-19-11z" fill="#EAF4FF" opacity=".85"/>
    <circle cx="860" cy="208" r="9" fill="#fff" stroke="#0071E3" stroke-width="4"/>
    <circle cx="953" cy="170" r="9" fill="#fff" stroke="#5E5CE6" stroke-width="4"/>
    <path d="M860 194c12-22 53-42 81-36" stroke="#fff" stroke-width="2" stroke-dasharray="4 6" opacity=".9"/>
    <ellipse cx="911" cy="319" rx="54" ry="7" fill="#506DBA" opacity=".25"/>
  </g>
  <g fill="#fff" stroke="#A8C7F3" stroke-width="2">
    <circle cx="116" cy="252" r="10"/><circle cx="1034" cy="190" r="8"/><circle cx="729" cy="133" r="6"/>
  </g>
  <circle cx="116" cy="252" r="4" fill="#34C759"/><circle cx="1034" cy="190" r="3" fill="#5E5CE6"/><circle cx="729" cy="133" r="2.5" fill="#0071E3"/>
</svg>
